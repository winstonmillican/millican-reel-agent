steps:
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - "cd frontend && npm install && npm run build"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/millican-reel-agent/app:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/millican-reel-agent/app:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "millican-reel-agent"
      - "--image"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/millican-reel-agent/app:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--timeout"
      - "900"
      - "--set-env-vars"
      - "ANTHROPIC_API_KEY=$_ANTHROPIC_API_KEY"

substitutions:
  _ANTHROPIC_API_KEY: "YOUR_ANTHROPIC_API_KEY"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/millican-reel-agent/app:$COMMIT_SHA"
